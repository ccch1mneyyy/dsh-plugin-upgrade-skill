name: Version corridor claim
description: Claim a DSH version corridor and prepare migration cards
labels:
  - version-tracking
  - card
body:
  - type: input
    id: from
    attributes:
      label: from exact tag or commit
      description: Use the official release tag or a full commit hash. Do not enter latest.
      placeholder: dsh-v0.1.1-rc.1
    validations:
      required: true
  - type: input
    id: to
    attributes:
      label: to exact tag or commit
      description: The target official release tag or full commit hash.
      placeholder: dsh-v0.1.1-rc.2
    validations:
      required: true
  - type: input
    id: corridor
    attributes:
      label: Target card or corridor
      description: State the card-set file and version edge you plan to add.
      placeholder: v0.1.1-rc.2.md
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Pinned primary sources
      description: Provide links to upstream source, a fixed tag, release notes, or architecture decisions.
      placeholder: https://github.com/deepseek-ai/deepseek-harness/releases/tag/...
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Claim scope
      description: Describe the touchpoints you will check, the consumer faces, and anything not covered.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Planned verification
      description: List validation commands, hands-on entry points, and platform or credential boundaries you cannot cover.
      placeholder: node scripts/validate.mjs
    validations:
      required: true
  - type: checkboxes
    id: coordination
    attributes:
      label: Coordination confirmation
      options:
        - label: I have checked existing issues and PRs — no duplicate claim, or coordination is already described in my notes.
          required: true
        - label: I will use a curated coverage declaration and will not describe the cards as a complete API diff.
          required: true
